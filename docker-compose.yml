name: mdce-site

services:
  editor:
    build: .
    pull_policy: build
    container_name: mdce-site
    restart: unless-stopped
    ports:
      - "8090:8080"
    expose:
      - "8080"
    volumes:
      - ${CHART_ROOT:-/mnt/Custom_Albums}:/data/Custom_Albums
    environment:
      - CHART_ROOT=/data/Custom_Albums
      # Optional: force Syncthing to rescan after each chart save
      - SYNCTHING_URL=${SYNCTHING_URL:-}
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY:-}
      - SYNCTHING_FOLDER_ID=${SYNCTHING_FOLDER_ID:-}
    labels:
      proxy.aliases: mdce
      proxy.mdce: |
        port: 8080
        scheme: http
        homepage:
          name: Muse Dash Chart Editor
          category: Apps
