[package]
name = "stagepen"
version = "0.1.2"
description = "Stagepen — Muse Dash chart editor"
authors = ["Kokomilk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stagepen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
