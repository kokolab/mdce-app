name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: Stagepen ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseBody: "Windows build. Run the setup exe, then use File → Link chart folder and pick your existing chart folder."
          releaseDraft: false
          prerelease: false
      - name: Attach the program exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }} src-tauri/target/release/stagepen.exe --clobber --repo ${{ github.repository }}
